# Сборка и публикация одного образа в ghcr.io. Вызов из CI проекта:
#
#   image:
#     uses: dnovichkov/sites_configs/.github/workflows/build-image.yml@main
#     permissions:
#       contents: read
#       packages: write
#     with:
#       image: money-envelope-frontend      # → ghcr.io/dnovichkov/money-envelope-frontend
#       context: frontend
#       dockerfile: frontend/Dockerfile.prod
#       build-args: |
#         VITE_SITE_URL=https://money-envelope.dmdp.ru
#
# Теги: полный sha коммита (его передаёт deploy.yml) и latest — только для основной ветки.
# На pull request образ собирается для проверки, но не публикуется.
# Секреты в build-args не передать: в `with:` вызывающего workflow доступны только vars.

name: Build image

on:
  workflow_call:
    inputs:
      image:
        description: Имя образа без реестра и владельца
        type: string
        required: true
      context:
        description: Контекст сборки от корня репозитория
        type: string
        default: .
      dockerfile:
        description: Dockerfile от корня репозитория; по умолчанию <context>/Dockerfile
        type: string
        default: ""
      build-args:
        description: Аргументы сборки, по одному KEY=VALUE в строке
        type: string
        default: ""

jobs:
  build:
    name: ${{ inputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          build-args: ${{ inputs.build-args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
