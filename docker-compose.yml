# Caddy — единая точка входа (80/443) для всех сайтов на сервере.
#
# Конфигурацию генерирует build.py из projects.toml:
#   caddy/Caddyfile      маршруты (+ caddy/snippets.caddy, правится руками)
#   site/                витрина projects.dmdp.ru
#   compose.static.yml   монтирование статических сайтов — подключается вторым -f
#
# Разворачивается через deploy.sh, который передаёт оба compose-файла.

# Имя проекта закреплено: от него зависят имена томов, а в caddy_data лежат сертификаты.
name: sites_configs

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      # Каталоги, а не отдельные файлы: git pull заменяет файл новым, и смонтированный
      # по одному файлу Caddyfile внутри контейнера остался бы старым.
      - ./caddy:/etc/caddy:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  # Общая сеть: Caddy находит контейнеры проектов по их container_name.
  web:
    external: true
